<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token 统计 · Furnace Ledger</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="ember-glow" aria-hidden="true"></div>

  <div class="wrap">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div class="brand-text">
          <h1>Token 统计</h1>
          <span class="brand-sub">FURNACE&nbsp;LEDGER · CLAUDE × CODEX</span>
        </div>
      </div>
      <div class="meta" id="meta">加载中…</div>
    </header>

    <!-- HERO：今年烧掉多少 token -->
    <section class="hero">
      <div class="hero-left">
        <div class="hero-label" id="heroRange">今年累计烧掉</div>
        <div class="hero-number" id="heroTotal" title="">—</div>
        <div class="hero-foot">
          <span class="hero-unit">TOKENS</span>
          <span class="hero-dot">·</span>
          <span class="hero-cost" id="heroCost">—</span>
        </div>
      </div>
      <div class="hero-right">
        <div class="split-title">CLAUDE / CODEX 占比</div>
        <div class="splitbar" id="heroSplitbar"></div>
        <div class="split-legend" id="heroSplitLegend"></div>
      </div>
    </section>

    <!-- 支撑数据：今日 / 本周 / 本月 -->
    <section class="stats" id="stats"></section>

    <!-- 趋势图 -->
    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>近 30 天 · 每日消耗</h2>
        <div class="legend">
          <span class="dot claude"></span>Claude
          <span class="dot codex"></span>Codex
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="dailyChart"></canvas>
      </div>
    </section>

    <!-- 拆分明细 -->
    <section class="panel">
      <div class="panel-head">
        <h2>拆分明细</h2>
        <div class="period-toggle" id="periodToggle">
          <button data-period="today">今日</button>
          <button data-period="week">本周</button>
          <button data-period="month" class="active">本月</button>
          <button data-period="year">今年</button>
        </div>
      </div>
      <div class="tables">
        <div class="table-block">
          <h3>按模型</h3>
          <table id="modelTable">
            <thead>
              <tr><th>模型</th><th>源</th><th class="num">输入</th><th class="num">输出</th><th class="num">缓存读</th><th class="num">缓存写</th><th class="num">合计</th><th class="num">费用</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="table-block">
          <h3>按项目</h3>
          <table id="projectTable">
            <thead>
              <tr><th>项目</th><th>源</th><th class="num">合计</th><th class="num">费用</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span id="pricingNote"></span>
    </footer>
  </div>

  <script src="/static/chart.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
