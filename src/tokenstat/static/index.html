<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token 统计 · Furnace Ledger</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- 用量告警横幅 -->
  <div class="alert-bar" id="alertBar" style="display:none">
    <span class="alert-icon">⚠</span>
    <span id="alertMsg"></span>
    <button class="alert-close" onclick="dismissAlert()">×</button>
  </div>

  <!-- 告警设置弹窗 -->
  <div class="settings-modal" id="settingsModal" style="display:none">
    <div class="settings-inner">
      <div class="settings-title">用量告警设置</div>
      <div class="settings-row">
        <label>今日费用超过 $</label>
        <input type="number" id="alertCost" min="0" step="0.1" placeholder="留空不告警">
      </div>
      <div class="settings-row">
        <label>今日 Token 超过（万）</label>
        <input type="number" id="alertTokens" min="0" step="1" placeholder="留空不告警">
      </div>
      <div class="settings-row settings-check">
        <label for="desktopNotify">启用 macOS 通知</label>
        <input type="checkbox" id="desktopNotify">
      </div>
      <div class="settings-actions">
        <button onclick="saveSettings()">保存</button>
        <button onclick="toggleSettings()">取消</button>
      </div>
    </div>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="ember-glow" aria-hidden="true"></div>

  <div class="wrap">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div class="brand-text">
          <h1>Token 统计</h1>
          <span class="brand-sub">FURNACE&nbsp;LEDGER · CLAUDE × CODEX</span>
        </div>
      </div>
      <div class="masthead-right">
        <button class="settings-btn" onclick="toggleSettings()" title="告警设置">⚙</button>
        <div class="meta" id="meta">加载中…</div>
      </div>
    </header>

    <!-- HERO：今年烧掉多少 token -->
    <section class="hero">
      <div class="hero-left">
        <div class="hero-label" id="heroRange">今日烧掉</div>
        <div class="hero-number" id="heroTotal" title="">—</div>
        <div class="hero-foot">
          <span class="hero-unit">TOKENS</span>
          <span class="hero-dot">·</span>
          <span class="hero-cost" id="heroCost">—</span>
        </div>
      </div>
      <div class="hero-right">
        <div class="split-title">CLAUDE / CODEX 占比</div>
        <div class="splitbar" id="heroSplitbar"></div>
        <div class="split-legend" id="heroSplitLegend"></div>
      </div>
    </section>

    <!-- 支撑数据：今日 / 本周 / 本月 -->
    <section class="stats" id="stats"></section>

    <!-- 运行审计 + 异常洞察 -->
    <section class="panel audit-panel">
      <div class="panel-head">
        <h2>运行审计</h2>
        <span class="status-pill" id="auditStatus">检查中</span>
      </div>
      <div class="audit-grid">
        <div class="audit-block">
          <h3>数据源</h3>
          <div id="auditSources" class="kv-list"></div>
        </div>
        <div class="audit-block">
          <h3>入库状态</h3>
          <div id="auditIngest" class="kv-list"></div>
        </div>
        <div class="audit-block">
          <h3>口径风险</h3>
          <div id="auditIssues" class="issue-list"></div>
        </div>
      </div>
    </section>

    <section class="panel insights-panel">
      <div class="panel-head">
        <h2>异常洞察</h2>
        <span class="panel-note" id="insightDate">今日</span>
      </div>
      <div class="insight-cards" id="insightCards"></div>
    </section>

    <!-- 拆分明细 -->
    <section class="panel">
      <div class="panel-head">
        <h2>拆分明细</h2>
        <div class="period-toggle" id="periodToggle">
          <button data-period="today" class="active">今日</button>
          <button data-period="week">本周</button>
          <button data-period="month">本月</button>
          <button data-period="year">今年</button>
        </div>
      </div>
      <div class="tables">
        <div class="table-block">
          <h3>按模型</h3>
          <table id="modelTable">
            <thead>
              <tr><th>模型</th><th>源</th><th class="num">输入</th><th class="num">输出</th><th class="num">缓存读</th><th class="num">缓存写</th><th class="num">合计</th><th class="num">费用</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="table-block">
          <h3>按项目</h3>
          <table id="projectTable">
            <thead>
              <tr><th>项目</th><th>源</th><th class="num">合计</th><th class="num">费用</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 趋势图 -->
    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>近 30 天 · 每日消耗</h2>
        <div class="legend">
          <span class="dot claude"></span>Claude
          <span class="dot codex"></span>Codex
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="dailyChart"></canvas>
      </div>
    </section>

    <!-- Top 10 最贵会话 -->
    <section class="panel">
      <div class="panel-head">
        <h2>TOP 10 · 最贵会话</h2>
      </div>
      <div class="table-block" style="overflow-x:auto">
        <table id="topSessionsTable">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>日期</th>
              <th>项目</th>
              <th>模型</th>
              <th>源</th>
              <th class="num">Tokens</th>
              <th class="num">估算费用</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="session-detail" id="sessionDetail" hidden></div>
    </section>

    <footer class="footer">
      <span id="pricingNote"></span>
    </footer>
  </div>

  <script src="/static/chart.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
