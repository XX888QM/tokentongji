<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 统计</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/styles.css" />
<script src="/static/chart.min.js"></script>
</head>
<body>
<div class="app">
  <!-- Alert -->
  <div class="alert" id="alertBar" style="display:none">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="alertMsg"></span>
    <button class="close" onclick="dismissAlert()">&times;</button>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo" aria-label="GPT">
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
          <circle cx="32" cy="32" r="24"></circle>
          <path d="M32 13.5c5.3 0 9.8 3.3 11.4 7.8 4.8.9 8.4 5.1 8.4 10.1 0 4.4-2.8 8.2-6.6 9.7-.7 5.2-5.1 9.1-10.4 9.1-2.8 0-5.3-1-7.2-2.8-4.8.9-9.7-1.7-11.7-6.2-1.7-4-.7-8.6 2.3-11.4-1.1-5.1 1.6-10.4 6.5-12.5 2.5-1 5.1-.9 7.3.2z"></path>
          <path d="M25.1 19.9 32 24l6.9-4.1M32 24v8.1l-6.9 4M32 32.1l6.9 4M18.2 29.4l7 4M44.8 33.4l5-2.9M27.5 47.4v-8.3"></path>
        </svg>
      </div>
      <h1>Token 统计</h1>
    </div>
    <div class="header-right">
      <div class="header-meta">
        <span class="live">在线</span>
        <span id="meta" style="display:block">加载中…</span>
      </div>
      <button class="btn-ghost" onclick="toggleSettings()">⚙ 告警设置</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-card">
      <div class="hero-label" id="heroRange">今日消耗</div>
      <div class="hero-number" id="heroTotal" title="">—</div>
      <div class="hero-foot">
        <span class="hero-cost">预估费用 <strong id="heroCost">¥—</strong></span>
      </div>
    </div>
    <div class="hero-card">
      <div class="hero-sub">各来源占比</div>
      <div class="splitbar" id="heroSplitbar"></div>
      <div class="split-legend" id="heroSplitLegend"></div>
    </div>
  </section>

  <!-- Stat cards -->
  <section class="stats" id="stats"></section>

  <!-- Audit -->
  <section class="panel">
    <div class="panel-head">
      <h2>运行审计</h2>
      <span class="status-pill" id="auditStatus">检查中</span>
    </div>
    <div class="audit-grid">
      <div class="audit-block"><h3>数据源</h3><div id="auditSources"></div></div>
      <div class="audit-block"><h3>入库状态</h3><div id="auditIngest"></div></div>
      <div class="audit-block"><h3>口径风险</h3><div id="auditIssues"></div></div>
    </div>
  </section>

  <!-- Insights -->
  <section class="panel">
    <div class="panel-head">
      <h2>异常洞察</h2>
      <span class="panel-note" id="insightDate">今日</span>
    </div>
    <div class="insight-cards" id="insightCards"></div>
  </section>

  <!-- Breakdown -->
  <section class="panel">
    <div class="panel-head">
      <h2>拆分明细</h2>
      <div class="period-toggle" id="periodToggle">
        <button data-period="today" class="active">今日</button>
        <button data-period="week">近7天</button>
        <button data-period="month">本月</button>
        <button data-period="year">今年</button>
      </div>
    </div>
    <div class="tables">
      <div class="table-block">
        <h3>按模型</h3>
        <table id="modelTable">
          <thead><tr><th>模型</th><th>源</th><th class="num">输入</th><th class="num">输出</th><th class="num">缓存读</th><th class="num">缓存写</th><th class="num">合计</th><th class="num">费用</th></tr></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
      <div class="table-block">
        <h3>按项目</h3>
        <table id="projectTable">
          <thead><tr><th>项目</th><th>源</th><th class="num">合计</th><th class="num">费用</th></tr></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </div>
  </section>

  <!-- Chart -->
  <section class="panel">
    <div class="panel-head">
      <h2>近 30 天消耗趋势</h2>
      <div class="chart-legend" id="dailyLegend"></div>
    </div>
    <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
  </section>

  <!-- Top sessions -->
  <section class="panel">
    <div class="panel-head"><h2>TOP 10 最贵会话</h2></div>
    <table id="topSessionsTable">
      <thead><tr><th class="num">#</th><th>日期</th><th>项目</th><th>模型</th><th>源</th><th class="num">Tokens</th><th class="num">费用</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="session-detail" id="sessionDetail" hidden></div>
  </section>

  <footer class="footer"><span id="pricingNote"></span></footer>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal">
    <h3>用量告警设置</h3>
    <div class="modal-row"><label>今日费用超过 ¥</label><input type="number" id="alertCost" min="0" step="0.1" placeholder="不告警"></div>
    <div class="modal-row"><label>今日 Token 超过（万）</label><input type="number" id="alertTokens" min="0" step="1" placeholder="不告警"></div>
    <div class="modal-row"><label>启用桌面通知</label><input type="checkbox" id="desktopNotify"></div>
    <div class="modal-actions">
      <button class="btn" onclick="toggleSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
